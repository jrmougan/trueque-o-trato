# Solo para desarrollo local (Postgres + MinIO). docker-compose.yml se mantiene
# para `pnpm db:up`. `mise run setup` genera en .env un COMPOSE_PROJECT_NAME,
# credenciales y puertos propios por checkout/worktree; todo escucha en 127.0.0.1.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ejecuta mise run setup primero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta mise run setup primero}
      POSTGRES_DB: ${POSTGRES_DB:?Ejecuta mise run setup primero}
    ports:
      - "127.0.0.1:${DATABASE_PORT:?Ejecuta mise run setup primero}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Las imágenes minio/minio y minio/mc ya no se publican en Docker Hub; se usa la
  # variante -dev de Chainguard (incluye sh y mc), fijada por digest.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:ddb2b6f82c3732f1e1688c9278fa08d857ac94e06f90f05ba096d56b9c68ffa3
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Ejecuta mise run setup primero}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Ejecuta mise run setup primero}
    ports:
      - "127.0.0.1:${MINIO_PORT:?Ejecuta mise run setup primero}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?Ejecuta mise run setup primero}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Crea el bucket (idempotente) y lo deja con lectura pública.
  minio-init:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:ddb2b6f82c3732f1e1688c9278fa08d857ac94e06f90f05ba096d56b9c68ffa3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Ejecuta mise run setup primero}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET"
    restart: "no"

volumes:
  pgdata:
  miniodata:
